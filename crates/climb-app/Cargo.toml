[package]
name = "climb-app"
version = "0.1.0"
edition = "2021"
description = "攀岩线路高亮 — Tauri 桌面端"
license = "MIT"

[[bin]]
name = "climb-highlight-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
climb-core = { path = "../climb-core" }
image.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
<title>攀岩线路高亮</title>
</head>
<body>
<div id="app">
  <header id="toolbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3.4" fill="var(--accent)"/><circle cx="16" cy="8" r="3.4" fill="var(--accent)" opacity="0.55"/><circle cx="8" cy="16" r="3.4" fill="var(--accent)" opacity="0.55"/><circle cx="16" cy="16" r="3.4" fill="var(--accent)" opacity="0.28"/></svg>
      <span class="brand-name">攀岩线路高亮</span>
    </div>

    <div class="tb-group">
      <button id="btn-open" class="btn"><img src="icons/folder-open.svg" alt=""><span class="txt">打开文件夹</span></button>
      <button id="btn-open-img" class="btn"><img src="icons/image.svg" alt=""><span class="txt">打开图片</span></button>
      <span id="folder-name" class="muted"></span>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group tools" role="toolbar" aria-label="工具">
      <button class="tool" data-tool="pan" title="拖移视图 [1]"><img src="icons/hand.svg" alt="拖移"></button>
      <button class="tool active" data-tool="select" title="点岩点选线 [2]"><img src="icons/cursor-click.svg" alt="选线"></button>
      <button class="tool" data-tool="lasso" title="圈选补测 [3]"><img src="icons/lasso.svg" alt="圈选补测"></button>
      <button class="tool" data-tool="remove" title="抹除误检：这不是岩点，净化抹平 [4]"><img src="icons/eraser.svg" alt="抹除"></button>
      <button class="tool" data-tool="exclude" title="排除：颜色误判，保留灰点不抹平 [5]"><img src="icons/prohibit.svg" alt="排除"></button>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group">
      <button id="btn-undo" class="btn" title="撤销 [Ctrl+Z]"><img src="icons/arrow-counter-clockwise.svg" alt=""><span class="txt">撤销</span></button>
      <button id="btn-fit" class="btn" title="适应窗口 [F]"><img src="icons/frame-corners.svg" alt=""><span class="txt">适应</span></button>
    </div>

    <div class="spacer"></div>

    <div class="tb-group">
      <span id="model-status" class="muted small"></span>
      <button id="btn-export" class="btn btn-accent"><img src="icons/download-simple.svg" alt=""><span class="txt">导出本张</span></button>
      <button id="btn-batch" class="btn"><img src="icons/stack.svg" alt=""><span class="txt">批量导出</span></button>
    </div>
  </header>

  <div id="main">
    <aside id="sidebar">
      <section class="side-sec">
        <div class="side-head">
          <span class="side-title">图片</span>
          <span id="img-count" class="muted small"></span>
        </div>
        <div id="file-list" class="list"></div>
      </section>

      <section class="side-sec grow">
        <div class="side-head">
          <span class="side-title">颜色线路</span>
          <span class="muted small">点击选择</span>
        </div>
        <div id="cluster-list" class="list"></div>
      </section>

      <section class="side-sec">
        <div class="side-head"><span class="side-title">参数</span><span class="muted small">松手生效</span></div>
        <div class="param">
          <label for="p-feather">边缘羽化 <output id="p-feather-v"></output></label>
          <input type="range" id="p-feather" min="0" max="8" step="0.5">
        </div>
        <div class="param">
          <label for="p-bgsat">背景保留饱和度 <output id="p-bgsat-v"></output></label>
          <input type="range" id="p-bgsat" min="0" max="0.35" step="0.01">
        </div>
        <div class="param">
          <label for="p-bgfill">墙面净化 <output id="p-bgfill-v"></output></label>
          <input type="range" id="p-bgfill" min="0" max="1" step="0.05">
          <div class="param-hint">抹平脏墙与螺丝孔；0 = 关闭</div>
        </div>
        <div class="param">
          <label for="p-outline">描边高亮 <output id="p-outline-v"></output></label>
          <input type="range" id="p-outline" min="0" max="1" step="0.05">
          <div class="param-hint">选中线路描橙色边；灰点在灰墙上也可辨；0 = 关闭</div>
        </div>
        <div class="param param-toggle">
          <label for="p-person">攀岩者保色</label>
          <label class="switch"><input type="checkbox" id="p-person"><span class="track"></span></label>
        </div>
        <div class="param-hint">检测到人物时：开 = 攀岩者彩色，关 = 随背景灰度</div>
        <details id="adv-params">
          <summary>高级参数<span class="muted small">（默认已调好，需重分析）</span></summary>
          <div class="param">
            <label for="p-wallk">灵敏度 <output id="p-wallk-v"></output></label>
            <input type="range" id="p-wallk" min="3" max="10" step="0.1">
            <div class="param-hint">越小检出越多（墙面差分阈值倍数）</div>
          </div>
          <div class="param">
            <label for="p-minarea">最小岩点 <output id="p-minarea-v"></output></label>
            <input type="range" id="p-minarea" min="-4.6" max="-2.2" step="0.05">
            <div class="param-hint">占画面比例，对数刻度</div>
          </div>
        </details>
      </section>

      <section class="side-sec" id="info-sec">
        <div class="side-head"><span class="side-title">检测信息</span></div>
        <div id="info-body" class="mono small muted">未分析</div>
      </section>

      <div id="sidebar-footer">
        <button id="btn-reset" class="btn btn-warn"><img src="icons/arrow-counter-clockwise.svg" alt="">重新检测</button>
      </div>
    </aside>

    <main id="stage">
      <div id="viewer">
        <div id="viewer-inner">
          <img id="view-img" draggable="false" alt="攀岩墙">
          <svg id="overlay"></svg>
          <div id="scan-overlay" hidden>
            <div class="veil"></div>
            <div class="scan-trail echo"></div>
            <div class="scan-trail"></div>
            <div class="scan-line"></div>
            <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
            <div class="scan-label">
              <div class="scan-title">正在分析<span id="scan-dots"></span></div>
              <div class="scan-stage" id="scan-stage">读取图像</div>
            </div>
          </div>
        </div>

        <div id="empty-state">
          <svg class="empty-logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3.4" fill="var(--accent)"/><circle cx="16" cy="8" r="3.4" fill="var(--accent)" opacity="0.55"/><circle cx="8" cy="16" r="3.4" fill="var(--accent)" opacity="0.55"/><circle cx="16" cy="16" r="3.4" fill="var(--accent)" opacity="0.28"/></svg>
          <div class="empty-title">GRIP · 攀岩线路高亮</div>
          <div class="empty-hint">打开文件夹 / 打开图片，或把图片拖进来</div>
          <div class="empty-keys">1 拖移 · 2 选线 · 3 圈选 · 4 移除 · 空格对比原图</div>
        </div>

        <div id="hint-bar"></div>
        <div class="seg" id="view-toggle">
          <button data-view="result" class="seg-btn">结果</button>
          <button data-view="original" class="seg-btn">原图</button>
        </div>
        <button id="overlay-toggle" class="mini-toggle" title="叠加检测框 [O]">叠加</button>
      </div>

      <div id="log-panel" hidden></div>
      <footer id="statusbar">
        <span id="st-file" class="muted"></span>
        <span id="st-zoom" class="muted"></span>
        <span id="st-msg" class="muted"></span>
        <div class="spacer"></div>
        <div id="batch-progress" hidden><span id="batch-text"></span><div class="bar"><div id="batch-fill"></div></div></div>
        <button id="log-toggle" class="mini-toggle">日志</button>
      </footer>
    </main>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>

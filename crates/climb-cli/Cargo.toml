[package]
name = "climb-cli"
version = "0.1.0"
edition = "2021"
description = "攀岩线路高亮 CLI：批处理 + AI agent 会话模式"
license = "MIT"

[[bin]]
name = "GRIP-cli"
path = "src/main.rs"

[dependencies]
climb-core = { path = "../climb-core" }
image.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
serde.workspace = true

name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: 下载模型文件（EdgeSAM + ChalkGPT 源权重）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          Invoke-WebRequest -Uri "https://huggingface.co/camenduru/EdgeSAM/resolve/main/edge_sam_3x_encoder.onnx" -OutFile "models/edge_sam_3x_encoder.onnx" -TimeoutSec 600
          Invoke-WebRequest -Uri "https://huggingface.co/camenduru/EdgeSAM/resolve/main/edge_sam_3x_decoder.onnx" -OutFile "models/edge_sam_3x_decoder.onnx" -TimeoutSec 600
          Invoke-WebRequest -Uri "https://cdn.jsdelivr.net/gh/GabiShahmayster/ChalkGPT@main/weights/holds/v1/weights/best.pt" -OutFile "models/chalkgpt_holds_best.pt" -TimeoutSec 600

      - name: 导出岩点检测 ONNX（ultralytics, opset 12）
        shell: pwsh
        run: |
          python -m pip install ultralytics --quiet --disable-pip-version-check
          python -c "from ultralytics import YOLO; YOLO(r'models/chalkgpt_holds_best.pt').export(format='onnx', imgsz=640, opset=12, simplify=True)"
          Move-Item models/chalkgpt_holds_best.onnx models/chalkgpt_holds.onnx -Force

      - name: 构建 CLI
        run: cargo build --release --locked -p climb-cli

      - name: 构建 GUI（Tauri）
        run: cargo build --release --locked -p climb-app

      - name: 打包
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          $models = @("models/chalkgpt_holds.onnx", "models/edge_sam_3x_encoder.onnx", "models/edge_sam_3x_decoder.onnx", "models/README.md")
          Compress-Archive -Path (@("target/release/climb-cli.exe") + $models) -DestinationPath dist/climb-cli-windows-x86_64.zip -Force
          Compress-Archive -Path (@("target/release/climb-highlight-app.exe") + $models) -DestinationPath dist/climb-highlight-app-windows-x86_64.zip -Force

      - name: 发布（tag 推正式版 / main 推 nightly 预发布）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
          name: ${{ github.ref_type == 'tag' && format('climb-highlight {0}', github.ref_name) || 'nightly 构建' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          files: dist/*.zip
